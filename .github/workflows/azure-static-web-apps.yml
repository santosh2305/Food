name: Validate and deploy Shanvis kitchen
on:
  push:
    branches: [main, feat/shanvis-refresh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shanvis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build with approved public business configuration
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'feat/shanvis-refresh')
        run: npm run build
        env:
          VITE_UPI_QR_PATH: ${{ vars.VITE_UPI_QR_PATH }}
          VITE_ENABLE_COD: ${{ vars.VITE_ENABLE_COD }}
          VITE_ENABLE_PAY_ON_PICKUP: ${{ vars.VITE_ENABLE_PAY_ON_PICKUP }}
          VITE_PICKUP_ADDRESS: ${{ vars.VITE_PICKUP_ADDRESS }}
      - name: Deploy verified build
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'feat/shanvis-refresh')
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # Reviewed official action revision
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
