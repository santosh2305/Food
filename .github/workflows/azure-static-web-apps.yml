name: Validate and deploy Shanvis kitchen
on:
  push:
    branches: [main, feat/shanvis-kitchen]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shanvis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build with approved public business configuration
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'feat/shanvis-kitchen')
        run: npm run build
        env:
          VITE_UPI_QR_PATH: ${{ vars.VITE_UPI_QR_PATH }}
          VITE_ENABLE_COD: ${{ vars.VITE_ENABLE_COD }}
          VITE_ENABLE_PAY_ON_PICKUP: ${{ vars.VITE_ENABLE_PAY_ON_PICKUP }}
          VITE_PICKUP_ADDRESS: ${{ vars.VITE_PICKUP_ADDRESS }}
      - name: Deploy verified build
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'feat/shanvis-kitchen')
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: ${{ github.ref_name }}
